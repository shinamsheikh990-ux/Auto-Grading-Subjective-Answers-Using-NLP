{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span style="font-size: 2.5rem;">✨</span>
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-top: 0.5rem;">Create Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Join the NLP Grading Platform</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" class="form-control" name="name" id="name" placeholder="e.g. Jane Doe" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="role">Account Type</label>
        <select class="form-control" name="role" id="role" required>
          <option value="student">Student (Answer & Submit)</option>
          <option value="teacher">Teacher (Add Questions & Evaluate)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-control" name="username" id="username" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" name="password" id="password" placeholder="Create a password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Register</button>
    </form>

    <div style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
